[package]
name = "ai-dubbing-app"
version = "0.1.0"
description = "本地 AI 视频翻译配音工作台（Tauri 桌面壳）"
edition = "2021"

[lib]
name = "ai_dubbing_app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"

serde = { version = "1", features = ["derive"] }
serde_json = "1"
