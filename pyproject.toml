[project]
name = "ai-dubbing"
version = "0.1.0"
description = "本地 AI 视频翻译配音工作台（MVP 端到端链路验证）"
requires-python = ">=3.10"
dependencies = [
    "faster-whisper>=1.0.0",
    "edge-tts>=6.1.0",
    "imageio-ffmpeg>=0.5.0",
    "openai>=1.30.0",
    "requests>=2.31.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "ruff>=0.4.0",
]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.setuptools]
packages = []
