[project]
name = "ai-dubbing"
version = "0.1.0"
description = "本地 AI 视频翻译配音工作台（MVP 端到端链路验证）"
requires-python = ">=3.10"
dependencies = [
    "faster-whisper>=1.0.0",
    "edge-tts>=7.0.0",
    "imageio-ffmpeg>=0.5.0",
    "openai>=1.30.0",
    "requests>=2.31.0",
    "diarize>=0.1.2",
    "silero-vad>=6.2.1",
    "wespeakerruntime>=1.0.1",
    "scikit-learn>=1.5.0",
    "soundfile>=0.12.0",
    "fastapi>=0.110.0",
    "uvicorn>=0.29.0",
    "sse-starlette>=2.0.0",
    "python-multipart>=0.0.9",
    "yt-dlp>=2024.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "ruff>=0.4.0",
]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.setuptools]
packages = []
